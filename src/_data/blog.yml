# Series are optional groupings inside a top-level category.
# On a post, set `categories: musings` or `categories: life` and optionally `series: <slug>`.
# Add a series here to control its label and the order of the blog filters.
# Avoid YAML booleans as slugs or labels (`on`, `On`, `off`, `yes`, `no`).
series:
  - slug: a-curious-life
    label: A curious life
    parent: musings
