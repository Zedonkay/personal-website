# Local quote bank. Client-side pick on the about page.
# text is required; attribution, source, url are optional.
#
# items:
#   - text: "..."
#     attribution: "Name"
#     source: "Work"
#     url: https://example.com
items:
  - text: If more of us valued food and cheer and song above hoarded gold, it would be a merrier world.
    attribution: Thorin Oakenshield
    source: The Hobbit
  - text: So many books, so little time.
    attribution: Frank Zappa
  - text: Without music, life would be a mistake.
    attribution: Friedrich Nietzsche
    source: Twilight of the Idols
  - text: A day without laughter is a day wasted.
    attribution: Nicolas Chamfort
  - text: I have no idea what I'm going to do tomorrow. How exciting.
    attribution: Larry Daley and Teddy Roosevelt (Robin Williams)
    source: "Night at the Museum: Secret of the Tomb"
  - text: You can't fly jets if you're color blind.
    attribution: Frank (Steve Carell)
    source: Little Miss Sunshine
  - text: I wish the Ring had never come to me. I wish none of this had happened. So do all who live to see such times, but that is not for them to decide. All we have to decide is what to do with the time that is given to us.
    attribution: Frodo and Gandalf
    source: The Lord of the Rings
  - text: Me? I'm dishonest, and a dishonest man you can always trust to be dishonest. Honestly. It's the honest ones you want to watch out for, because you can never predict when they're going to do something incredibly... stupid.
    attribution: Captain Jack Sparrow
    source: "Pirates of the Caribbean: The Curse of the Black Pearl"
  - text: The only true wisdom is in knowing you know nothing.
    attribution: Socrates
  - text: Hold fast to dreams, for if dreams die, life is a broken-winged bird that cannot fly.
    attribution: Langston Hughes
    source: Dreams
  - text: You don't understand! I coulda had class. I coulda been a contender. I could've been somebody, instead of a bum, which is what I am.
    attribution: Terry Malloy (Marlon Brando)
    source: On the Waterfront
  - text: Louis, I think this is the beginning of a beautiful friendship.
    attribution: Rick Blaine (Humphrey Bogart)
    source: Casablanca
  - text: I am big! It's the pictures that got small.
    attribution: Norma Desmond (Gloria Swanson)
    source: Sunset Boulevard
  - text: Today, I consider myself the luckiest man on the face of the Earth.
    attribution: Lou Gehrig
  - text: Gentlemen, you can't fight in here! This is the War Room!
    attribution: President Merkin Muffley (Peter Sellers)
    source: Dr. Strangelove
  - text: Forget it, Jake, it's Chinatown.
    attribution: Lawrence Walsh (Joe Mantell)
    source: Chinatown
  - text: Surely you can't be serious. I am serious... and don't call me Shirley.
    attribution: Ted Striker and Dr. Rumack
    source: Airplane!
  - text: Carpe diem. Seize the day, boys. Make your lives extraordinary.
    attribution: John Keating (Robin Williams)
    source: Dead Poets Society
