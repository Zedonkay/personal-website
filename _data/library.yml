items:
  - title: "Slaughterhouse-Five"
    creator: Kurt Vonnegut
    url: https://en.wikipedia.org/wiki/Slaughterhouse-Five
    type: book
    date: 1969-03-31
    note: >
      An intriguing exploration of concepts I care a lot about.

  - title: "The Silmarillion"
    creator: J.R.R. Tolkien
    url: https://en.wikipedia.org/wiki/The_Silmarillion
    type: book
    date: 1977-09-15
    note: >
      I've always loved myth, and the idea of writing a book that lets you
      develop your own myth system is so cool. I really appreciate the ideas
      it puts forth about the way the world works, and I love the direction
      Tolkien took with it.

