    creator: Raphael Bob-Waksberg
    source: Netflix
    url: https://en.wikipedia.org/wiki/BoJack_Horseman
    type: show
    date: 2014-08-22
    image: /assets/img/library/bojack-horseman.jpg
    note: >
      It's become a TV show I reference regularly. I think it does satire
