name: Deploy site

on:
  push:
    branches:
      - master
      - main
      - experimental
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
      - experimental
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Required for cross-repo deploy to avoid credential conflicts
          persist-credentials: ${{ github.ref != 'refs/heads/experimental' }}
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Configure URL for branch 🔧
        run: |
          if [ "${{ github.ref }}" == "refs/heads/experimental" ]; then
            echo "Configuring for experimental branch (zedonkay.github.io)"
            sed -i 's|^url:.*|url: https://zedonkay.github.io|g' _config.yml
            # Verify the change was successful
            if grep -q "url: https://zedonkay.github.io" _config.yml; then
              echo "✅ URL successfully updated to zedonkay.github.io"
            else
              echo "❌ Failed to update URL"
              exit 1
            fi
          else
            echo "Configuring for main/master branch (ishayushikhare.com)"
            # Verify production URL is set
            if grep -q "url: https://ishayushikhare.com" _config.yml; then
              echo "✅ Production URL verified: ishayushikhare.com"
            else
              echo "⚠️ Warning: Production URL may not be set correctly"
            fi
          fi
      - name: Remove CNAME for experimental branch 🗑️
        if: github.ref == 'refs/heads/experimental'
        run: |
          if [ -f "CNAME" ]; then
            echo "Removing CNAME file for experimental branch deployment"
            rm CNAME
          fi
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # Deploy main/master to this repo's gh-pages → ishayushikhare.com
      - name: Deploy to production (main) 🚀
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

      # Deploy experimental to zedonkay.github.io repo → staging site
      - name: Deploy to staging (experimental) 🚀
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/experimental'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          repository-name: Zedonkay/zedonkay.github.io
          branch: main
          token: ${{ secrets.DEPLOY_TOKEN }}
